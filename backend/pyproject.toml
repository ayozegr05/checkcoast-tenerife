[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # el formateador ajusta el código; quedan strings/URLs largas
    "B008", # Depends()/Query() en defaults es el patrón de FastAPI
    "B905", # zip(xs, xs[1:]) es intencionadamente de longitud distinta
    "UP042", # StrEnum cambia str()/format() de los enums de SQLAlchemy
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["W291"] # cabecera autogenerada por Alembic

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
