services:
  db:
    build: ./db
    container_name: checkcoast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkcoast
      POSTGRES_PASSWORD: checkcoast
      POSTGRES_DB: checkcoast
    ports:
      # Puerto externo 5433 para evitar colisiones con Postgres locales en 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkcoast -d checkcoast"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: checkcoast-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose la BD es "db" en el puerto interno 5432
      DATABASE_URL: postgresql+psycopg2://checkcoast:checkcoast@db:5432/checkcoast
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Fingerprint SHA-256 del keystore EAS (Android App Links /b/{id})
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # Clave de POST /beaches/{id}/status (cabecera X-Admin-Key)
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      # Puerto externo 8001: el 8000 lo usa otro proyecto
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Solo en la VM (perfil prod): TLS automático con Let's Encrypt para
  # checkcoast.duckdns.org; requiere 80/443 abiertos en OCI.
  caddy:
    image: caddy:2-alpine
    container_name: checkcoast-caddy
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
