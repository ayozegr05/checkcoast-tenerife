services:
  db:
    image: postgis/postgis:16-3.4
    container_name: checkcoast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkcoast
      POSTGRES_PASSWORD: checkcoast
      POSTGRES_DB: checkcoast
    ports:
      # Puerto externo 5433 para evitar colisiones con Postgres locales en 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkcoast -d checkcoast"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: checkcoast-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose la BD es "db" en el puerto interno 5432
      DATABASE_URL: postgresql+psycopg2://checkcoast:checkcoast@db:5432/checkcoast
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      # Puerto externo 8001: el 8000 lo usa otro proyecto
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
