name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: checkcoast
          POSTGRES_PASSWORD: checkcoast
          POSTGRES_DB: checkcoast_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U checkcoast -d checkcoast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://checkcoast:checkcoast@localhost:5432/checkcoast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: python -m pytest tests/ -q --cov=app --cov-report=xml
      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          # La cobertura es best-effort: un fallo de upload nunca tumba CI
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --coverage --coverageReporters=cobertura
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/cobertura-coverage.xml
          flags: frontend
          # La cobertura es best-effort: un fallo de upload nunca tumba CI
          fail_ci_if_error: false

  # Suite Maestro en emulador Android. La app (dev-client) carga el JS
  # de Metro y pega contra la API de producción vía EXPO_PUBLIC_API_URL
  # — no hace falta backend en CI. El APK es un asset del release
  # `dev-client-e2e`; si cambian deps nativas hay que regenerarlo
  # (eas build --profile development) y resubirlo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Dos pushes seguidos no deben competir por el mismo caché de AVD —
    # el segundo espera a que el primero lo escriba
    concurrency:
      group: e2e-emulator
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download dev-client APK
        run: >-
          curl -fSL -o /tmp/dev-client.apk
          https://github.com/ayozegr05/checkcoast-tenerife/releases/download/dev-client-e2e/application-59ab82da-a214-4689-99cb-b66356cc9a53.apk
      - name: Start Metro
        run: |
          EXPO_PUBLIC_API_URL=http://130.110.233.198:8001 \
            npx expo start --dev-client --port 8082 > /tmp/metro.log 2>&1 &
      # El AVD cacheado (con el dev-client ya instalado y snapshot
      # guardado) evita ~25 min de cold boot + install en cada run.
      # Bump de la key si el AVD queda corrupto o cambia el APK.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          # Solo el AVD: meter ~/.android/adb* cachea el estado del
          # daemon adb y el siguiente run no puede conectar
          path: ~/.android/avd/*
          key: avd-34-pixel7pro-v2
      # Solo en cache-miss: crea el AVD e instala el APK; al terminar el
      # paso el emulador guarda snapshot y el cache lo captura
      - name: Create AVD + install dev-client
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: checkcoast-e2e
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -memory 6144 -cores 4
          disable-animations: true
          script: adb install /tmp/dev-client.apk
      # OJO: el action ejecuta cada línea del script en un sh -c propio
      # — no persisten cd ni variables; usar rutas absolutas
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        # En el emulador frío de GitHub el server UIAutomator de Maestro
        # tarda mucho más que el default (15 s); 5 min da margen
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: checkcoast-e2e
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -memory 6144 -cores 4
          disable-animations: true
          script: |
            adb wait-for-device
            timeout 120 bash -c 'until curl -sf http://localhost:8082/status >/dev/null; do sleep 3; done'
            maestro test "$GITHUB_WORKSPACE/frontend/e2e/flows/" || \
              maestro test "$GITHUB_WORKSPACE/frontend/e2e/flows/"
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests
            /tmp/metro.log
          retention-days: 7
