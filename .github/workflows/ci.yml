name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: checkcoast
          POSTGRES_PASSWORD: checkcoast
          POSTGRES_DB: checkcoast_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U checkcoast -d checkcoast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://checkcoast:checkcoast@localhost:5432/checkcoast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest

  # Suite Maestro en emulador Android. La app (dev-client) carga el JS
  # de Metro y pega contra la API de producción vía EXPO_PUBLIC_API_URL
  # — no hace falta backend en CI. El APK es un asset del release
  # `dev-client-e2e`; si cambian deps nativas hay que regenerarlo
  # (eas build --profile development) y resubirlo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download dev-client APK
        run: >-
          curl -fSL -o /tmp/dev-client.apk
          https://github.com/ayozegr05/checkcoast-tenerife/releases/download/dev-client-e2e/checkcoast-dev-client.apk
      - name: Start Metro
        run: |
          EXPO_PUBLIC_API_URL=http://130.110.233.198:8001 \
            npx expo start --dev-client --port 8082 > /tmp/metro.log 2>&1 &
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd "$GITHUB_WORKSPACE/frontend"
            adb wait-for-device
            adb install /tmp/dev-client.apk
            # Metro corre en el host (el emulador lo alcanza vía 10.0.2.2);
            # esperar a que sirva el manifest antes de lanzar los flows
            timeout 120 bash -c 'until curl -sf http://localhost:8082/status >/dev/null; do sleep 3; done'
            maestro test e2e/flows/
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests
            /tmp/metro.log
          retention-days: 7
