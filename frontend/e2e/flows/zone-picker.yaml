# E2E: playa multi-PM → selector de zonas → ficha PM → atrás → picker.
# Cubre la coreografía frágil de cámara (zoneFocus: flyTo al PM y
# restore de vista al volver al selector) — la zona que refactorizaría
# useMapCamera. Sin este test, ese refactor era reescribir a ciegas.
#
# Correr: maestro test e2e/flows/zone-picker.yaml

appId: com.checkcoast.tenerife
name: Zonas — picker → PM → atrás → picker
---
- stopApp
- openLink: exp+checkcoast-tenerife://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8082
# La intro solo aparece en primer arranque — tolerar ambos estados
- extendedWaitUntil:
    visible:
      text: Continue|Entendido|Buscar playa, emisario o municipio|^Wait$
    timeout: 120000
# Wait = ANR del launcher en emulador frío ("Pixel Launcher isn't
# responding" tapa la app en CI) — descartarlo si aparece
- tapOn:
    text: ^Wait$
    optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Entendido
    optional: true
- extendedWaitUntil:
    visible:
      text: Buscar playa, emisario o municipio|Entendido|Continue|^Wait$
    timeout: 30000
- tapOn:
    text: ^Wait$
    optional: true
- tapOn:
    text: Continue
    optional: true
    # Continue = onboarding del dev-client; Entendido = intro de la app
- tapOn:
    text: Entendido
    optional: true
- assertVisible: Buscar playa, emisario o municipio

# Playa Jardín tiene 3 PMs (El Castillo/El Charcón/Punta Brava):
# el tap abre el SELECTOR, no una ficha directa
- tapOn: Buscar playa, emisario o municipio
# Si el tap llegó con la app aún cargando y el campo no abrió, reintentar
- runFlow:
    when:
      notVisible: Buscar playa, emisario o municipio\.\.\.
    commands:
      - tapOn: Buscar playa, emisario o municipio
- extendedWaitUntil:
    visible:
      text: Buscar playa, emisario o municipio\.\.\.
    timeout: 10000
- tapOn: Buscar playa, emisario o municipio\.\.\.
- inputText: Jardin
# Teclado fuera antes de tocar la fila: con el teclado abierto el
# picker monta detrás y el assert no ve las zonas
- hideKeyboard
# La a11y label de la fila es "Playa Jardín, Puerto de la Cruz · 3
# zonas" — Maestro casa el texto COMPLETO del nodo, así que hace
# falta .* para el sufijo. El subtítulo desambigua del emisario
# "Aliviadero Ebar Playa Jardín", que también contiene el nombre
- extendedWaitUntil:
    visible:
      text: Playa Jardín, Puerto de la Cruz.*
    timeout: 15000
- tapOn: Playa Jardín, Puerto de la Cruz.*

# El selector de zonas abre — las filas llevan el nombre común de la
# cala (mapa curado de zones.ts), no "Zona N" del censo
- extendedWaitUntil:
    visible: El Castillo
    timeout: 15000

# Elegir una zona → ficha del PM (aquí ocurre el flyTo de zoneFocus)
- tapOn: El Castillo
- extendedWaitUntil:
    visible: Cerrar ficha
    timeout: 15000

# Atrás hardware → vuelve al SELECTOR (no cierra) — restore de vista
- back
- extendedWaitUntil:
    visible: El Castillo
    timeout: 10000

# Cierre limpio
- tapOn: Cerrar ficha
- assertNotVisible: Cerrar ficha
