# E2E: tap nativo en un pin del mapa → picker → cerrar → restore de vista.
#
# Los pines son símbolos nativos de MapLibre: NO están en el árbol de
# a11y, se tocan por coordenadas relativas. Cubre handlePress →
# saveView → fitBounds/flyTo → onSelect, la restauración de savedView
# al cerrar y el veto userPanned (pan manual → no restaurar) — el
# camino de cámara que los otros flows no alcanzan y el más frágil
# para el refactor de useMapCamera.
#
# La playa del test debe ser multi-PM NO expandable: grupos con todas
# las zonas nombradas (Jardín, Médano) se splitean en dots de cala a
# ZONE_SPLIT_ZOOM (14.5) — el tap abre la ficha de la zona, no el
# picker, y varios dots invalidan la geometría "el pin está en X".
# Teresitas tiene 4 PMs anónimos ("Zona 1..4") → pin de centroide a
# todo zoom + picker en cada tap.
#
# Posiciones calibradas (Pixel_7_Pro_API_34, 1440x3120):
#  - Tras buscar "Teresitas" y cerrar el picker, el pin del centroide
#    queda en ~(51%,25%) — pickResult no guarda vista (savedView=null),
#    así que el cierre no restaura y el pin sigue donde el fitBounds
#    lo dejó.
#  - El swipe derecha lo desplaza a x≈74%; la y varía con el drift del
#    gesto (observado 24–48%) → se sondea una columna de puntos.
#
# OJO: el mapa NO renderiza en el AVD API 30 (eglChooseConfig → no
# configs en cualquier -gpu): el hit-test de pins está muerto ahí.
# Usar el AVD API 34 (google_apis x86_64).
#
# Correr: maestro test e2e/flows/pin-tap.yaml

appId: com.checkcoast.tenerife
name: Pin — tap en pin abre ficha; cierre restaura vista salvo pan manual
---
- stopApp
- openLink: exp+checkcoast-tenerife://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8082
- extendedWaitUntil:
    visible:
      text: Continue|Entendido|Buscar playa, emisario o municipio|^Wait$
    timeout: 120000
# Continue = onboarding del dev-client (cold start tras stopApp);
# Entendido = intro de la app; Wait = ANR del launcher en emulador
# frío ("Pixel Launcher isn't responding" tapa la app en CI).
# Ambas pueden montar un instante tarde
- tapOn:
    text: ^Wait$
    optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Entendido
    optional: true
- extendedWaitUntil:
    visible:
      text: Buscar playa, emisario o municipio|Entendido|Continue|^Wait$
    timeout: 30000
- tapOn:
    text: ^Wait$
    optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Entendido
    optional: true
# Si un tap aterrizó sobre el dev menu del dev-client (TOOLS/Go home),
# atrás lo cierra antes de asertar
- runFlow:
    when:
      visible: Open DevTools
    commands:
      - back
- assertVisible: Buscar playa, emisario o municipio

# Búsqueda → flyTo/fitBounds al grupo: el pin del centroide queda
# centrado en la franja libre (~51%,25%)
- tapOn: Buscar playa, emisario o municipio
- runFlow:
    when:
      notVisible: Buscar playa, emisario o municipio\.\.\.
    commands:
      - tapOn: Buscar playa, emisario o municipio
- extendedWaitUntil:
    visible:
      text: Buscar playa, emisario o municipio\.\.\.
    timeout: 10000
- tapOn: Buscar playa, emisario o municipio\.\.\.
- inputText: Teresitas
# Teclado fuera antes de tocar la fila: así no se come el tap ni queda
# sobre la ficha que abre (con el teclado abierto el picker monta lento
# y el ✕ queda tapado)
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: Playa de las Teresitas, Santa Cruz de Tenerife.*
    timeout: 15000
- tapOn: Playa de las Teresitas, Santa Cruz de Tenerife.*
# Primer montaje del picker en cold start: el mapa renderiza por
# software y la JS va justa — margen alto. El token es el hint del
# selector ("N zonas de esta playa"), exclusivo del picker — los
# nombres de zona pueden filtrarse por el mini-mapa de las fichas
- extendedWaitUntil:
    visible: .*zonas de esta playa
    timeout: 60000

# Cerrar picker: el primer back lo come el teclado si sigue abierto;
# el segundo (condicional) cierra la ficha. Como la búsqueda no guarda
# vista, la cámara se queda donde el fitBounds la dejó → pin en 51%,25%
- back
- runFlow:
    when:
      visible: .*zonas de esta playa
    commands:
      - back
- assertNotVisible: .*zonas de esta playa
- waitForAnimationToEnd

# TAP AL PIN en 51%,25% (por coordenada — no está en a11y):
# handlePress → saveView → fitBounds → picker de zonas. Si el hit-test
# nativo rompe, esto falla
- tapOn:
    point: 51%, 25%
- extendedWaitUntil:
    visible: .*zonas de esta playa
    timeout: 20000

# Pan manual CON la ficha abierta → userPanned=true. El swipe a y=45%
# cae sobre el mapa (la ficha ocupa el ~40% inferior) y desplaza el
# pin a x≈74% con y variable (drift del gesto)
- swipe:
    start: 45%, 45%
    end: 70%, 45%
    duration: 1200
- waitForAnimationToEnd

# Cerrar con userPanned → NO debe restaurar: el pin ya no está en
# 51%,25% y el tap de sondeo no abre nada
- back
- assertNotVisible: .*zonas de esta playa
- waitForAnimationToEnd
- tapOn:
    point: 51%, 25%
- waitForAnimationToEnd
- assertNotVisible: .*zonas de esta playa

# Restore positivo: el pin quedó en la columna x≈74% (y variable por
# el drift del swipe). Escalera de sondas: cada wait opcional da
# tiempo a que la ficha monte antes de evaluar la siguiente sonda
- tapOn:
    point: 74%, 24%
- extendedWaitUntil:
    visible: Cerrar ficha
    timeout: 4000
    optional: true
- runFlow:
    when:
      notVisible: Cerrar ficha
    commands:
      - tapOn:
          point: 74%, 30%
      - extendedWaitUntil:
          visible: Cerrar ficha
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible: Cerrar ficha
    commands:
      - tapOn:
          point: 74%, 36%
      - extendedWaitUntil:
          visible: Cerrar ficha
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible: Cerrar ficha
    commands:
      - tapOn:
          point: 74%, 42%
      - extendedWaitUntil:
          visible: Cerrar ficha
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible: Cerrar ficha
    commands:
      - tapOn:
          point: 74%, 48%
      - extendedWaitUntil:
          visible: Cerrar ficha
          timeout: 4000
          optional: true

# Reencuadre tras cierre: si una sonda abrió la ficha (pin tocado),
# al cerrar un grupo multi-PM la cámara encuadra el arenal entero —
# el pin vuelve a la franja libre (~51%,25%) y este tap lo reabre.
# Es el comportamiento deseado (aterrizaje en el arenal, no en el
# zoom de detalle del PM), así que se aserta el picker abierto
- runFlow:
    when:
      visible: Cerrar ficha
    commands:
      - back
      - waitForAnimationToEnd
      - tapOn:
          point: 51%, 25%
      - extendedWaitUntil:
          visible: .*zonas de esta playa
          timeout: 10000

# Cierre limpio por si quedó algo abierto
- runFlow:
    when:
      visible: Cerrar ficha
    commands:
      - back
- assertNotVisible: .*zonas de esta playa
